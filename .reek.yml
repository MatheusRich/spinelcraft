# Reek finds code smells. Run `mise exec -- reek main.rb game tools`. With
# no paths, Reek reads each file under .claude before it excludes them.
#
# Only the detectors below run, and each one keeps a rule of this game:
# - ControlParameter and BooleanParameter: an argument that switches what a
#   method does, such as a true or false flag. Use a keyword argument or
#   two methods.
# - UncommunicativeVariableName and UncommunicativeParameterName: a name of
#   one letter or a name that ends in a digit. x, y and z are good names.
# - UnusedParameters: an argument that the method does not use.
#
# LongParameterList, TooManyInstanceVariables, TooManyMethods,
# RepeatedConditional and NilCheck run too, but they are not rules. They
# are leads for the find-extraction skill. A class with many variables and
# methods, a method with many parameters, and the same test in many methods
# point to an object that is not yet extracted.
#
# FeatureEnvy and UtilityFunction are off. They find a method that uses the
# data of another object more than its own, but they also count numbers
# such as x as objects. So they are leads for the find-extraction skill,
# not rules.
#
# The exclude lists hold the methods with old offenses. A new method is
# still checked. When a fix removes the last offense of a method, make the
# lists again with `mise exec -- ruby tools/reek_todo.rb`.
